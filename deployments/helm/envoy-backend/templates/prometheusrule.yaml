{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.deployment.name | default (include "envoy-backend.fullname" .) }}
  labels:
    {{- include "envoy-backend.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: envoy-backend
      rules:
        {{- toYaml .Values.prometheusRule.rules | nindent 8 }}
{{- end }}
