apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default (include "envoy-backend.fullname" .) }}
  labels:
    {{- include "envoy-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "envoy-backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
