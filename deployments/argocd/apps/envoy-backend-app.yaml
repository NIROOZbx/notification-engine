apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/NIROOZbx/notification-engine.git'
    targetRevision: main
    path: deployments/helm/envoy-backend
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
