version: "3"

dotenv: [".env"]

vars:
  MIGRATION_PATH: "db/migration"
  DB_URL: "postgres://{{.DB_USER}}:{{.DB_PASSWORD}}@localhost:{{.DB_PORT}}/{{.DB_NAME}}?sslmode=require"
  COMPOSE_FILE: deployments/docker-compose.yml

tasks:
  gen-proto:
    desc: Generate Go code from protobuf definitions
    cmds:
      - |
        protoc --proto_path=proto \
               --go_out=proto --go_opt=paths=source_relative \
               --go-grpc_out=proto --go-grpc_opt=paths=source_relative \
               proto/*.proto
    sources:
      - proto/*.proto
    generates:
      - proto/*.pb.go

  up:
    desc: Starting docker compose (postgres,redis,backend)
    cmds:
      - echo "Starting docker compose"
      - docker compose -f {{.COMPOSE_FILE}} up --build -d
  down:
    desc: Stop all containers
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down
  stop:
    desc: Stop containers
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop

  down-v:
    desc: Stop containers and delete all volumes — fresh start
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v
  remove:
    desc: Remove stopped containers
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} rm

  #Commands used to migrate to the database
  migrate-create:
    desc: Create a new migration file pair
    cmds:
      - echo "Creating migration files..."
      - migrate create -ext sql -dir {{.MIGRATION_PATH}} -seq {{.CLI_ARGS}}

  migrate-down:
    cmds:
      - echo "Dropping database schema..."
      - migrate -path {{.MIGRATION_PATH}} -database "{{.DB_URL}}" down {{.CLI_ARGS}}

  migrate-up:
    cmds:
      - echo "Applying database migrations..."
      - migrate -path {{.MIGRATION_PATH}} -database "{{.DB_URL}}" up
      - echo "✅ Database is up to date!"

  migrate-force:
    cmds:
      - echo "Forcing database migration..."
      - migrate -path {{.MIGRATION_PATH}} -database "{{.DB_URL}}" force {{.CLI_ARGS}}

  gen-sqlc:
    desc: "Generate SQLC code from anywhere"
    dir: C:\notification-engine\db
    cmds:
      - sqlc generate
  mock:
    desc: "Generate mocks for repositories and engine core"
    cmds:
      - mockery --all --dir=internal/repositories --output=internal/repositories/mocks
      - mockery --name="Repository|Producer|Renderer" --dir=engine/notification/core --output=internal/repositories/mocks
      - mockery --all --dir=internal/services --output=internal/services/mocks
      - mockery --all --dir=internal/session --output=internal/session/mocks
      - mockery --all --dir=internal/billing --output=internal/billing/mocks

  start:
    desc: Full boot sequence (Infra -> Migrate -> Logs)
    cmds:
      - task: up
      - echo "⏳ Waiting for database to initialize..."
      - task: migrate-up
      # - echo "🚀 System live. Tailing backend logs..."
      # - docker compose -f {{.COMPOSE_FILE}} logs -f backend

  test-service:
    desc: "Run all unit tests in the project"
    cmds:
      - go test -v ./internal/services

  test-engine:
    desc: Run unit tests for notification engine core
    cmds:
      - go test -v ./engine/notification/core

  build-image:
    desc: Build the production Docker image for the notification engine backend
    cmds:
      - docker build -t envoy-backend:latest .

  k8s-deploy:
    desc: Deploy all manifests in deployments/k8s/ to Kubernetes
    cmds:
      - kubectl apply -f deployments/k8s/

  k8s-delete:
    desc: Tear down all deployments and services from Kubernetes
    cmds:
      - kubectl delete -f deployments/k8s/

  k8s-status:
    desc: Check the status of all pods, services, ingress, and external secrets
    cmds:
      - kubectl get pods,svc,ingress,externalsecret,secret -o wide

  k8s-logs-backend:
    desc: Tail logs for the envoy-backend pod
    cmds:
      - kubectl logs -l app=envoy-backend -f --tail=100

  k8s-logs-billing:
    desc: Tail logs for the billing-service pod
    cmds:
      - kubectl logs -l app=billing-backend -f --tail=100

  tf-init:
    desc: Initialize Terraform configuration
    dir: deployments/terraform/prod
    cmds:
      - terraform init {{.CLI_ARGS}}

  tf-fmt:
    desc: Format Terraform configuration files
    dir: deployments/terraform/prod
    cmds:
      - terraform fmt -recursive

  tf-validate:
    desc: Validate Terraform configuration files
    dir: deployments/terraform/prod
    cmds:
      - terraform validate

  tf-plan:
    desc: Generate and show a Terraform execution plan
    dir: deployments/terraform/prod
    cmds:
      - terraform plan {{.CLI_ARGS}}

  tf-apply:
    desc: Builds or changes infrastructure according to Terraform configuration
    dir: deployments/terraform/prod
    cmds:
      - terraform apply {{.CLI_ARGS}}

  tf-destroy:
    desc: Destroy Terraform-managed infrastructure
    dir: deployments/terraform/prod
    cmds:
      - terraform destroy {{.CLI_ARGS}}
